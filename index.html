<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Cinema - Web Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #app-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #header {
            background-color: #0078D7;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }
        #chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg-system {
            background-color: #e3f2fd;
            color: #0d47a1;
            align-self: center;
            font-size: 0.9em;
            text-align: center;
        }
        .msg-user {
            background-color: #0078D7;
            color: white;
            align-self: flex-end;
        }
        .msg-assistant {
            background-color: #f1f3f4;
            color: #333;
            align-self: flex-start;
        }
        #input-area {
            display: flex;
            padding: 15px;
            background-color: #f4f4f9;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            outline: none;
        }
        #send-btn {
            background-color: #0078D7;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
        }
        #send-btn:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="header">Agentic Cinema Assistant</div>
    <div id="chat-window">
        <div class="message msg-system">Please enter your Gemini API Key to initialize the agent:</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn" onclick="handleSend()">Send</button>
    </div>
</div>

<script>
    let apiKey = "";
    let chatHistory = [];
    const chatWindow = document.getElementById('chat-window');
    const userInputField = document.getElementById('user-input');

    userInputField.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            handleSend();
        }
    });

    function appendMessage(sender, text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = `<strong>${sender}:</strong><br/>${text.replace(/\n/g, '<br/>')}`;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function handleSend() {
        const text = userInputField.value.trim();
        if (!text) return;
        
        userInputField.value = "";

        if (!apiKey) {
            apiKey = text;
            appendMessage("System", "API Key received. Agent initializing...", "msg-system");
            appendMessage("System", "Agent successfully loaded! How can I help schedule shoots or create VFX prompts today?", "msg-system");
            return;
        }

        appendMessage("You", text, "msg-user");
        chatHistory.push({ "role": "user", "parts": [{ "text": text }] });

        appendMessage("System", "Thinking...", "msg-system");

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "system_instruction": {
                        "parts": [{ "text": "You are an expert AI production assistant for a film studio. Your job is to help schedule shoots and generate detailed VFX prompts based on user requests. Act as if you have internal tools to process these tasks." }]
                    },
                    "contents": chatHistory
                })
            });

            const data = await response.json();
            chatWindow.removeChild(chatWindow.lastChild);

            if (data.error) {
                appendMessage("Error", data.error.message, "msg-system");
                apiKey = "";
                appendMessage("System", "Please enter a valid Gemini API Key:", "msg-system");
                chatHistory.pop();
            } else {
                const botReply = data.candidates[0].content.parts[0].text;
                appendMessage("Assistant", botReply, "msg-assistant");
                chatHistory.push({ "role": "model", "parts": [{ "text": botReply }] });
            }

        } catch (error) {
            chatWindow.removeChild(chatWindow.lastChild);
            appendMessage("Error", "Network error or API failure.", "msg-system");
        }
    }
</script>

</body>
</html>
